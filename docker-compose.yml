services:
  db:
    image: postgres:16-alpine
    container_name: loang-ecommerce-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loang}
      POSTGRES_DB: ${POSTGRES_DB:-loang}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loang} -d ${POSTGRES_DB:-loang}"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: loang-ecommerce-agent
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loang}:${POSTGRES_PASSWORD:-loang}@db:5432/${POSTGRES_DB:-loang}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CIRCUIT_BREAKER_MAX_TOKENS: ${CIRCUIT_BREAKER_MAX_TOKENS:-4000}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
      DOCS_PATH: /Documentos
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./agent/src:/app/src:ro
      - ./agent/knowledge:/app/knowledge:ro
      - documentos:/Documentos
    command: ["uvicorn", "agent.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: loang-ecommerce-worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loang}:${POSTGRES_PASSWORD:-loang}@db:5432/${POSTGRES_DB:-loang}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CIRCUIT_BREAKER_MAX_TOKENS: ${CIRCUIT_BREAKER_MAX_TOKENS:-4000}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
      DOCS_PATH: /Documentos
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./agent/src:/app/src:ro
      - ./agent/knowledge:/app/knowledge:ro
      - documentos:/Documentos
    command: ["python", "-m", "agent.worker"]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: loang-ecommerce-dashboard
    depends_on:
      - agent
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loang}:${POSTGRES_PASSWORD:-loang}@db:5432/${POSTGRES_DB:-loang}
      AGENT_API_URL: http://agent:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard/src:/app/src:ro
    command: ["npm", "run", "dev"]

volumes:
  db_data:
  documentos:
