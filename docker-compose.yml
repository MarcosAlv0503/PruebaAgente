services:
  db:
    image: postgres:16-alpine
    container_name: loang-template-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loang}
      POSTGRES_DB: ${POSTGRES_DB:-loang}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loang} -d ${POSTGRES_DB:-loang}"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      secrets:
        - loang_toolkit_token
    container_name: loang-template-agent
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loang}:${POSTGRES_PASSWORD:-loang}@db:5432/${POSTGRES_DB:-loang}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MAX_TOKENS_PER_RUN: ${MAX_TOKENS_PER_RUN:-1000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./agent/src:/app/src:ro
    command: ["uvicorn", "agent.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./agent
      dockerfile: Dockerfile
      secrets:
        - loang_toolkit_token
    container_name: loang-template-worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loang}:${POSTGRES_PASSWORD:-loang}@db:5432/${POSTGRES_DB:-loang}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MAX_TOKENS_PER_RUN: ${MAX_TOKENS_PER_RUN:-1000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./agent/src:/app/src:ro
    command: ["python", "-m", "agent.worker"]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: loang-template-dashboard
    depends_on:
      - agent
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loang}:${POSTGRES_PASSWORD:-loang}@db:5432/${POSTGRES_DB:-loang}
      AGENT_API_URL: http://agent:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard/src:/app/src:ro
    command: ["npm", "run", "dev"]

# BuildKit secrets: the value is read from the host environment at build time
# (set LOANG_TOOLKIT_TOKEN before running `make up` or
# `docker compose build`). It is not baked into any image layer.
secrets:
  loang_toolkit_token:
    environment: LOANG_TOOLKIT_TOKEN

volumes:
  db_data:
